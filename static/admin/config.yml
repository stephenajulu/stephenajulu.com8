backend:
  name: git-gateway
  branch: master

media_folder: static/images
public_folder: /images

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "image_alt", widget: "string", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Categories", name: "categories", widget: "list", default: ["Tech"] }
      - { label: "Tags", name: "tags", widget: "list", default: ["Sovereignty"] }
      - { label: "Gated Content (Members Only)", name: "gated", widget: "boolean", default: false }
      - { label: "Lead Magnet Name", name: "lead_magnet", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "notes"
    label: "Notes Feed"
    folder: "content/notes"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "note" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "portfolio"
    label: "Portfolio Projects"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "project" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Thumbnail Image", name: "thumb_image", widget: "image", required: false }
      - { label: "Thumbnail Alt", name: "thumb_image_alt", widget: "string", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "image_alt", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "til"
    label: "TIL (Today I Learned)"
    folder: "content/til"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "services"
    label: "Consulting Services"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Icon Name", name: "icon", widget: "string", default: "dribbble" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Static Pages"
    files:
      - file: "content/about.md"
        label: "About Page"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Featured Image", name: "image", widget: "image", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/cv.md"
        label: "CV Page"
        name: "cv"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "cv" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/now.md"
        label: "Now Page"
        name: "now"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/uses.md"
        label: "Uses Page"
        name: "uses"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/testimonials.md"
        label: "Testimonials Page"
        name: "testimonials"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/support.md"
        label: "Support Page"
        name: "support"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/reading.md"
        label: "Reading Page"
        name: "reading"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/privacy.md"
        label: "Privacy Policy Page"
        name: "privacy"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/things.md"
        label: "Things Page"
        name: "things"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
