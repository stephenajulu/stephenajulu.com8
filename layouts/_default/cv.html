{{ define "content" }}
<article class="post cv-page">
  <header class="post__header no-print">
    <div class="container container--md">
      <h1 class="post__title line-top">{{ .Params.title }}</h1>
      <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
        <button onclick="window.print()" class="button button--secondary" style="border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center;">
          <svg style="width: 16px; height: 16px; margin-right: 8px; fill: currentColor;" viewBox="0 0 24 24">
            <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
          </svg>
          Print / Save PDF
        </button>
      </div>
    </div>
  </header>
  <div class="post__body text-block">
    <div class="container container--md">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
