{{ define "content" }}
<header class="section section--header">
  <div class="container container--md" style="text-align: center; padding: 4rem 1rem;">
    <span style="font-size: 4rem; display: block; margin-bottom: 1.5rem;">📡</span>
    <h1 class="section__title line-top" style="margin-top: 1.5rem; display: inline-block;">You're Offline</h1>
    <p class="section__subtitle" style="margin-top: 1rem;">It looks like you don't have a reliable internet connection right now.</p>
    <div style="margin-top: 2rem;">
      <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 2rem;">But don't worry! Any previously visited pages on my digital home are cached and available for you to browse offline.</p>
      <a href="/" class="button button--primary" style="border-radius: 8px; justify-content: center;">Try Reloading Home</a>
    </div>
  </div>
</header>
{{ end }}
