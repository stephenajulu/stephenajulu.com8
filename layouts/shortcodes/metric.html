{{ $label := .Get "label" }}
{{ $val := .Get "value" }}
{{ $percent := .Get "percent" | default "50" }}
<div class="metric-card">
  <div class="metric-card__header">
    <span class="metric-card__label">{{ $label }}</span>
    <span class="metric-card__value">{{ $val }}</span>
  </div>
  <div class="metric-card__bar-bg">
    <div class="metric-card__bar-fill" style="width: {{ $percent }}%;"></div>
  </div>
</div>
