<div class="gated-wrapper" style="position: relative;">
  <div class="gated-content" style="filter: blur(8px); pointer-events: none; user-select: none; transition: filter 0.3s ease;">
    {{ .Inner }}
  </div>
  <div class="gate-cta" style="margin: 2rem 0; padding: 2rem; border: 1.5px dashed #6320d6; border-radius: 12px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.02);">
    <span style="font-size: 2.5rem; margin-bottom: 1rem;">🔒</span>
    <h4 style="margin: 0 0 0.5rem; font-family:'Fraunces', serif; font-weight: 500;">Sovereign Member Content</h4>
    <p style="font-size: 0.95rem; margin-bottom: 1.5rem; max-width: 320px;">This content is gated. Please sign in with your Netlify Identity or subscribe to support my work and unlock access.</p>
    <div class="button-group" style="justify-content: center; gap: 1rem; margin-bottom: 0;">
      <button class="button button--primary netlify-login-trigger" style="border-radius: 8px;">Log In / Register</button>
      <a href="/support" class="button" style="border-radius: 8px;">Become a Member</a>
    </div>
  </div>
</div>

<script>
(function() {
  // Load Netlify Identity Widget if not already loaded
  if (!window.netlifyIdentity) {
    const script = document.createElement("script");
    script.src = "https://identity.netlify.com/v1/netlify-identity-widget.js";
    document.head.appendChild(script);
    script.onload = initGate;
  } else {
    initGate();
  }

  function initGate() {
    netlifyIdentity.init();
    
    const checkUser = () => {
      const user = netlifyIdentity.currentUser();
      const wrappers = document.querySelectorAll(".gated-wrapper");
      wrappers.forEach(wrap => {
        const content = wrap.querySelector(".gated-content");
        const cta = wrap.querySelector(".gate-cta");
        if (user) {
          content.style.filter = "none";
          content.style.pointerEvents = "auto";
          content.style.userSelect = "auto";
          cta.style.display = "none";
        } else {
          content.style.filter = "blur(8px)";
          content.style.pointerEvents = "none";
          content.style.userSelect = "none";
          cta.style.display = "flex";
        }
      });
    };

    netlifyIdentity.on("init", checkUser);
    netlifyIdentity.on("login", checkUser);
    netlifyIdentity.on("logout", checkUser);

    document.querySelectorAll(".netlify-login-trigger").forEach(btn => {
      btn.addEventListener("click", () => {
        netlifyIdentity.open();
      });
    });
  }
})();
</script>
