{{ $date := .Get "date" | default (.Get 0) }}
{{ $title := .Get "title" | default (.Get 1) }}
<div class="timeline-item">
  <div class="timeline-item__date">{{ $date }}</div>
  <div class="timeline-item__content">
    {{ if $title }}<h4 class="timeline-item__title">{{ $title }}</h4>{{ end }}
    <div class="timeline-item__body">{{ .Inner | markdownify }}</div>
  </div>
</div>
