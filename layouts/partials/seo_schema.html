{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ .Site.Params.author.name | default "Stephen Ajulu" }}",
  "jobTitle": "Multidisciplinary Tech Consultant & Designer",
  "url": "{{ .Permalink }}",
  "sameAs": [
    "https://ajulusthoughts.stephenajulu.com",
    "https://github.com/stephenajulu"
  ],
  "knowsAbout": [
    "Strategic IT Advisory",
    "Managed Sovereign Digital Infrastructure",
    "Cloud Engineering",
    "Brand Identity and Logo Design",
    "Digital and Data Sovereignty Audits",
    "SME Digitalization",
    "Web Design and Development",
    "System Administration",
    "Technical Writing",
    "AI & Search Engine Optimization"
  ],
  "description": "{{ .Site.Params.description | default "Stephen Ajulu's digital home and sovereign platform showcasing advisory, design, and cloud engineering." }}"
}
</script>
{{ else if eq .Section "blog" }}
  {{ if .IsPage }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TechArticle",
    "headline": "{{ .Title }}",
    "description": "{{ .Params.excerpt | default .Summary }}",
    "datePublished": "{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}",
    "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ .Permalink }}"
    },
    "author": {
      "@type": "Person",
      "name": "{{ .Site.Params.author.name | default "Stephen Ajulu" }}"
    },
    "publisher": {
      "@type": "Person",
      "name": "{{ .Site.Params.author.name | default "Stephen Ajulu" }}"
    },
    "wordCount": "{{ .WordCount }}"
  }
  </script>
  {{ end }}
{{ else if eq .Section "services" }}
  {{ if .IsPage }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "name": "{{ .Title }}",
    "provider": {
      "@type": "Person",
      "name": "{{ .Site.Params.author.name | default "Stephen Ajulu" }}"
    },
    "description": "{{ .Params.subtitle | default .Summary }}",
    "url": "{{ .Permalink }}"
  }
  </script>
  {{ end }}
{{ end }}
