<div class="floating-actions">
  <!-- AI Chatbot Floating Circle Button -->
  <div class="floating-btn floating-btn--chatbot" id="chatbot-float" role="button" aria-haspopup="true" aria-expanded="false" aria-label="Open Ajulu AI Chatbot">
    <div class="floating-btn__content">
      <svg class="floating-btn__icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
      </svg>
      <span class="floating-btn__text">Chat with Ajulu AI</span>
    </div>

    <!-- Chatbot Popover Window -->
    <div class="chatbot-popover" id="chatbot-popover" click-propagation-preventer>
      <div class="chatbot-popover__header">
        <span>Ajulu AI Chatbot</span>
        <button class="chatbot-popover__close" id="chatbot-close" aria-label="Close Chatbot">&times;</button>
      </div>
      <div class="chatbot-popover__handoff">
        <button id="chatbot-handoff-btn">Initiate Handover (Stephen Online)</button>
      </div>
      <div class="chatbot-popover__body" id="chatbot-messages">
        <div class="chatbot-popover__msg chatbot-popover__msg--bot">
          Hello! I am Ajulu's AI assistant. Ask me anything about his consulting services, design work, or how to contact him.
        </div>
      </div>
      <div class="chatbot-popover__footer">
        <input type="text" id="chatbot-input" placeholder="Type a message..." aria-label="Type message for chatbot">
        <button id="chatbot-send">Send</button>
      </div>
    </div>
  </div>

  <!-- Book Call Floating Circle Button -->
  <a href="{{ .Site.Params.booking_url | default "/contact/" }}" class="floating-btn floating-btn--call" target="_blank" rel="noopener" aria-label="Book a Call with Mr. Ajulu">
    <div class="floating-btn__content">
      <svg class="floating-btn__icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      <span class="floating-btn__text">Book a Call with Mr. Ajulu</span>
    </div>
  </a>
</div>

<!-- Scroll Progress Bar -->
<div class="scroll-progress-bar" style="position: fixed; top: 0; left: 0; height: 4px; background: var(--color-accent, #6320d6); width: 0%; z-index: 10000; transition: width 0.1s ease-out; pointer-events: none;"></div>
